<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>متجر الرعاية العام | General Care</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 20px; 
        }
        .product-card { 
            background: white; 
            padding: 15px; 
            border-radius: 10px; 
            text-align: center; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }
    </style>
</head>
<body>

    <h1 style="text-align:center;">جميع منتجاتنا</h1>
    <div class="grid" id="productGrid">
        </div>

    <script>
        const grid = document.getElementById('productGrid');
        // إنشاء 30 منتج باستخدام حلقة تكرارية
        for (let i = 1; i <= 30; i++) {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img src="https://via.placeholder.com/150" alt="منتج">
                <h3>منتج رقم ${i}</h3>
                <p>السعر: ${i * 5} ر.س</p>
                <button>إضافة للسلة</button>
            `;
            grid.appendChild(card);
        }
    </script>
</body>
</html>
