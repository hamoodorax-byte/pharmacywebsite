<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة المشتريات | صيدلية النخبة</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="main-header">
        <div class="nav-container">
            <div class="logo"><a href="index.html" style="text-decoration:none; color:#16a34a;">Pharmacy<span>Plus</span></a></div>
            <h2>سلة المشتريات</h2>
            <div class="nav-icons">
                <a href="index.html" class="icon-link"><i class="fa-solid fa-house"></i></a>
            </div>
        </div>
    </header>

    <main class="cart-wrapper" style="padding: 40px 5%; display: flex; gap: 30px; flex-wrap: wrap;">
        <div class="cart-items-container" style="flex: 2; min-width: 300px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02);">
            <div id="empty-cart-msg" style="text-align: center; padding: 40px; display: none;">
                <i class="fa-solid fa-basket-shopping" style="font-size: 3rem; color: #cbd5e1; margin-bottom: 15px;"></i>
                <p>سلتك فارغة حالياً..</p>
                <a href="index.html" class="btn-shop" style="display: inline-block; margin-top: 15px;">تصفح المنتجات</a>
            </div>
            <div id="cart-table-wrapper">
                </div>
        </div>

        <div class="cart-summary" style="flex: 1; min-width: 280px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); height: fit-content;">
            <h3 style="color: #1e3a8a; margin-bottom: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px;">ملخص الطلب</h3>
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                <span>المجموع الفرعي:</span>
                <span id="subtotal-val">0.00 ر.س</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px; color: #16a34a; font-weight: 600;">
                <span>التوصيل:</span>
                <span id="shipping-val">مجاني</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 25px; font-size: 1.2rem; font-weight: 700; border-top: 2px dashed #e2e8f0; padding-top: 15px;">
                <span>الإجمالي:</span>
                <span id="total-val" style="color: #16a34a;">0.00 ر.س</span>
            </div>
            <button onclick="checkoutOrder()" class="btn-add-cart" style="background-color: #16a34a; font-size: 1.1rem; padding: 12px;"><i class="fa-solid fa-credit-card"></i> الانتقال للدفع الآمن</button>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const emptyMsg = document.getElementById("empty-cart-msg");
            const tableWrapper = document.getElementById("cart-table-wrapper");
            const subtotalVal = document.getElementById("subtotal-val");
            const totalVal = document.getElementById("total-val");

            let cart = JSON.parse(localStorage.getItem("pharmacyCart")) || [];

            function renderCart() {
                if (cart.length === 0) {
                    emptyMsg.style.display = "block";
                    tableWrapper.style.display = "none";
                    subtotalVal.textContent = "0.00 ر.س";
                    totalVal.textContent = "0.00 ر.س";
                    return;
                }

                emptyMsg.style.display = "none";
                tableWrapper.style.display = "block";

                let html = `<table style="width: 100%; border-collapse: collapse; text-align: right;">
                    <thead>
                        <tr style="border-bottom: 2px solid #f1f5f9; color: #64748b;">
                            <th style="padding: 10px;">المنتج</th>
                            <th style="padding: 10px;">السعر</th>
                            <th style="padding: 10px;">الكمية</th>
                            <th style="padding: 10px;">حذف</th>
                        </tr>
                    </thead>
                    <tbody>`;

                let subtotal = 0;

                cart.forEach((item, index) => {
                    const itemTotal = item.price * item.quantity;
                    subtotal += itemTotal;

                    html += `
                        <tr style="border-bottom: 1px solid #f1f5f9;">
                            <td style="padding: 15px 10px; font-weight: 600; color: #334155;">${item.name}</td>
                            <td style="padding: 15px 10px;">${item.price.toFixed(2)} ر.س</td>
                            <td style="padding: 15px 10px;">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <button onclick="changeQty(${index}, -1)" style="border:1px solid #cbd5e1; background:white; padding:2px 8px; border-radius:4px; cursor:pointer;">-</button>
                                    <span style="font-weight:600;">${item.quantity}</span>
                                    <button onclick="changeQty(${index}, 1)" style="border:1px solid #cbd5e1; background:white; padding:2px 8px; border-radius:4px; cursor:pointer;">+</button>
                                </div>
                            </td>
                            <td style="padding: 15px 10px;"><button onclick="removeItem(${index})" style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:1.1rem;"><i class="fa-solid fa-trash-can"></i></button></td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                tableWrapper.innerHTML = html;

                subtotalVal.textContent = `${subtotal.toFixed(2)} ر.س`;
                totalVal.textContent = `${subtotal.toFixed(2)} ر.س`;
            }

            window.changeQty = (index, change) => {
                cart[index].quantity += change;
                if (cart[index].quantity <= 0) {
                    cart.splice(index, 1);
                }
                localStorage.setItem("pharmacyCart", JSON.stringify(cart));
                renderCart();
            };

            window.removeItem = (index) => {
                cart.splice(index, 1);
                localStorage.setItem("pharmacyCart", JSON.stringify(cart));
                renderCart();
            };

            window.checkoutOrder = () => {
                alert("تم استلام طلبك التجريبي بنجاح! شكراً لتسوقك من صيدلية النخبة.");
                localStorage.removeItem("pharmacyCart");
                window.location.href = "index.html";
            };

            renderCart();
        });
    </script>
</body>
</html>
